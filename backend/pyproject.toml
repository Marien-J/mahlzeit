[project]
name = "mahlzeit"
version = "0.1.0"
description = "Private meal planning, shopping, food and training log for couples"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "email-validator>=2.2",
    "argon2-cffi>=25.1",
    "cryptography>=46",
    "pywebpush>=2.5",
    "typer>=0.27",
    "tzdata>=2025.2",
]

[project.scripts]
mahlzeit = "mahlzeit.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "httpx2>=2.13",
    "ruff>=0.16",
    "mypy>=2.4",
    "aiosmtpd>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mahlzeit"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "DTZ"]
ignore = ["S101", "B008", "N818"]  # N818: domain errors read as outcomes (NotFound, Conflict)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["mahlzeit"]

[[tool.mypy.overrides]]
module = ["pywebpush.*", "py_vapid.*", "aiosmtpd.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:mahlzeit.*"]
