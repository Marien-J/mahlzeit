name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mahlzeit
          POSTGRES_PASSWORD: mahlzeit
          POSTGRES_DB: mahlzeit
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U mahlzeit" --health-interval 2s --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://mahlzeit:mahlzeit@localhost:5433/mahlzeit
      TEST_DATABASE_URL: postgresql+psycopg://mahlzeit:mahlzeit@localhost:5433/mahlzeit_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests migrations && uv run ruff format --check src tests migrations
      - name: Types
        run: uv run mypy
      - name: Migrations apply and match the models
        run: uv run mahlzeit migrate && uv run alembic check
      - name: Tests
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint and format
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npx vite build

  api-client:
    name: Generated API client is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd backend && uv sync --frozen
      - run: cd frontend && npm ci
      - run: scripts/gen-client.sh
      - run: git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts

  stack:
    name: Images, end-to-end smoke test, restore drill
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: docker compose --profile ops build
      - name: Configure (the generated .env must work unedited)
        run: scripts/init-env.sh
      - name: Start stack
        run: docker compose up -d --wait
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: End-to-end smoke test (mobile viewport)
        run: scripts/e2e.sh
      - name: Restore drill
        run: scripts/restore-drill.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
